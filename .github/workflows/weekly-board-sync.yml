name: Job Radar - Weekly Upstream Board Update

on:
  schedule:
    - cron: '17 10 * * 0' # Sunday 10:17 UTC (06:17 EDT / 05:17 EST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-radar-upstream-board-update
  cancel-in-progress: false

jobs:
  update:
    if: vars.UPSTREAM_BOARD_SYNC_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: pip install requests
      - name: Test importer safety
        run: python -m unittest discover -s tests -p test_upstream_boards.py
      - name: Check upstream lists and add verified boards
        run: python tools/sync_upstream_boards.py --apply --max-checks 100
      - name: Preserve update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-board-report
          path: data/boards/upstream_sync_report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish only board inventory and validation history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/boards/BROAD_NON_WORKDAY_EXTRA.csv data/boards/upstream_check_state.json data/boards/upstream_sync_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: weekly verified upstream boards [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
